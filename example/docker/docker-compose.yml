version: "3.9"
services:
  s3mock:
    image: adobe/s3mock:2.11.0
    ports:
      - "127.0.0.1:9090:9090"
    environment:
      initialBuckets: example

  clamav:
    image: clamav/clamav:0.105
    ports:
      - "127.0.0.1:3310:3310"

  db:
    image: postgres:14.3-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_PASSWORD: postgres
