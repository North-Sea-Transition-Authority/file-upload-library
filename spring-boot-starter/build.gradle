import org.springframework.boot.gradle.plugin.SpringBootPlugin

plugins {
  id("java-library")
  id("org.springframework.boot")
  id("maven-publish")
  id("org.sonarqube") version "3.3"
  id("jacoco")
  id("idea")
}

dependencyManagement {
  imports {
    mavenBom SpringBootPlugin.BOM_COORDINATES
  }
}

sourceSets {
  integrationTest {
    java {
      srcDirs = ["src/integrationTest/java"]
      compileClasspath += main.output
      runtimeClasspath += main.output
    }
  }
}

java {
  withSourcesJar()
  withJavadocJar()
}

dependencies {
  implementation "org.springframework.boot:spring-boot-starter"
  implementation "org.springframework.boot:spring-boot-starter-validation"
  implementation "org.springframework.boot:spring-boot-starter-web"
  implementation "org.springframework.boot:spring-boot-starter-data-jpa"
  implementation 'org.springframework.data:spring-data-envers'
  implementation "net.javacrumbs.shedlock:shedlock-spring:5.3.0"
  implementation "net.javacrumbs.shedlock:shedlock-provider-jdbc-template:5.3.0"
  implementation "org.flywaydb:flyway-core"

  implementation "com.amazonaws:aws-java-sdk-s3:1.12.351"
  runtimeOnly "javax.xml.bind:jaxb-api:2.3.1"
  implementation "fi.solita.clamav:clamav-client:1.0.1"

  testImplementation "org.springframework.boot:spring-boot-starter-test"
  testImplementation(project(":spring-boot-starter-test"))

  // Integration tests
  integrationTestRuntimeOnly "org.postgresql:postgresql:42.6.0"
  integrationTestImplementation "org.testcontainers:postgresql:1.18.1"
  integrationTestImplementation "org.testcontainers:junit-jupiter:1.18.1"
  integrationTestImplementation "io.rest-assured:rest-assured:5.3.0"
  integrationTestImplementation "org.flywaydb:flyway-core"
  integrationTestImplementation "org.awaitility:awaitility"
}

sonarqube {
  properties {
    property 'sonar.coverage.jacoco.xmlReportPaths', "$buildDir/reports/jacoco/test/jacocoTestReport.xml"
    property "sonar.projectKey", "Fivium_${rootProject.name}"
    property "sonar.organization", "fivium-gh"
    property "sonar.host.url", "https://sonarcloud.io"
    property 'sonar.login', System.getenv('SONARCLOUD_TOKEN')

    if (System.getenv("DRONE_PULL_REQUEST") != null) {
      property 'sonar.pullrequest.key', System.getenv('DRONE_PULL_REQUEST')
      property 'sonar.pullrequest.base', System.getenv('DRONE_TARGET_BRANCH')
      property 'sonar.pullrequest.branch', System.getenv('DRONE_SOURCE_BRANCH')
      property 'sonar.pullrequest.provider', 'github'
      property 'sonar.pullrequest.github.repository', 'energy-portal-message-queue'
      property 'sonar.pullrequest.github.endpoint', 'https://api.github.com/'
    } else {
      property 'sonar.branch.name', System.getenv('DRONE_BRANCH')
      if (System.getenv('DRONE_BRANCH') != 'develop') {
        property 'sonar.branch.target', 'develop'
      }
    }
  }
}

pluginManager.withPlugin('maven-publish') {
  publishing {
    publications {
      springBootStarter(MavenPublication) {
        version = System.getenv("MAVEN_PUBLICATIONS_VERSION") ?: version
        artifactId = "file-upload-spring-boot-starter"

        from components.java
      }
    }
    repositories {
      maven {
        name = 'snapshots'
        url = 'https://nexus.fivium.co.uk/repository/maven-snapshots'
        credentials {
          username = System.getenv("NEXUS_USERNAME")
          password = System.getenv("NEXUS_PASSWORD")
        }
      }

      maven {
        name = 'releases'
        url = 'https://nexus.fivium.co.uk/repository/maven-releases'
        credentials {
          username = System.getenv("NEXUS_USERNAME")
          password = System.getenv("NEXUS_PASSWORD")
        }
      }
    }
  }
}

idea {
  module {
    sourceDirs -= file('src/integrationTest/java')
    testSources.from(sourceSets["integrationTest"].java.srcDirs)
  }
}

test {
  useJUnitPlatform()
  finalizedBy jacocoTestReport
}

tasks.register('integrationTest', Test) {
  useJUnitPlatform()
  group = "verification"
  testClassesDirs = sourceSets.integrationTest.output.classesDirs
  classpath = sourceSets.integrationTest.runtimeClasspath
}

configurations {
  integrationTestImplementation.extendsFrom(testImplementation)
  integrationTestRuntimeOnly.extendsFrom(testRuntimeOnly)
  integrationTestRuntimeOnly.extendsFrom(runtimeOnly)
}

jacocoTestReport {
  reports {
    xml.required = true
  }
}
