import org.springframework.boot.gradle.plugin.SpringBootPlugin

plugins {
  id("java-library")
  id("org.springframework.boot")
  id("maven-publish")
  id("jacoco")
  id("idea")
}

sourceSets {
  integrationTest {
    java {
      srcDirs = ["src/integrationTest/java"]
      compileClasspath += main.output
      runtimeClasspath += main.output
    }
  }
}

dependencies {
  implementation platform(SpringBootPlugin.BOM_COORDINATES)

  implementation "org.springframework.boot:spring-boot-starter"
  implementation "org.springframework.boot:spring-boot-starter-validation"
  implementation "org.springframework.boot:spring-boot-starter-web"
  implementation "org.springframework.boot:spring-boot-starter-data-jpa"
  implementation 'org.springframework.data:spring-data-envers'
  implementation "net.javacrumbs.shedlock:shedlock-spring:5.13.0"
  implementation "net.javacrumbs.shedlock:shedlock-provider-jdbc-template:5.13.0"
  implementation "org.flywaydb:flyway-core"
  implementation 'org.apache.commons:commons-lang3'

  implementation platform("software.amazon.awssdk:bom:2.32.26")
  implementation "software.amazon.awssdk:s3"
  implementation "software.amazon.awssdk:sts"

  implementation "fi.solita.clamav:clamav-client:1.0.1"

  testImplementation "org.springframework.boot:spring-boot-starter-test"
  testImplementation(project(":spring-boot-starter-test"))

  // Integration tests
  integrationTestRuntimeOnly "org.postgresql:postgresql"
  integrationTestRuntimeOnly "org.flywaydb:flyway-database-postgresql"

  integrationTestImplementation platform("org.testcontainers:testcontainers-bom:2.0.0")
  integrationTestImplementation "org.testcontainers:testcontainers-postgresql"
  integrationTestImplementation "org.testcontainers:testcontainers-junit-jupiter"
  integrationTestImplementation "org.testcontainers:testcontainers-minio"
  integrationTestImplementation "io.minio:minio:8.5.17"

  integrationTestImplementation "io.rest-assured:rest-assured"
  integrationTestImplementation "org.flywaydb:flyway-core"
  integrationTestImplementation "org.awaitility:awaitility"
}

pluginManager.withPlugin('maven-publish') {
  publishing {
    publications {
      springBootStarter(MavenPublication) {
        version = System.getenv("MAVEN_PUBLICATIONS_VERSION") ?: version
        artifactId = "file-upload-spring-boot-starter"

        from components.java
      }
    }
    repositories {
      maven {
        name = 'snapshots'
        url = 'https://nexus.fivium.co.uk/repository/maven-snapshots'
        credentials {
          username = System.getenv("NEXUS_USERNAME")
          password = System.getenv("NEXUS_PASSWORD")
        }
      }

      maven {
        name = 'releases'
        url = 'https://nexus.fivium.co.uk/repository/maven-releases'
        credentials {
          username = System.getenv("NEXUS_USERNAME")
          password = System.getenv("NEXUS_PASSWORD")
        }
      }
    }
  }
}

idea {
  module {
    sourceDirs -= file('src/integrationTest/java')
    testSources.from(sourceSets["integrationTest"].java.srcDirs)
  }
}

test {
  useJUnitPlatform()
  finalizedBy jacocoTestReport
  maxParallelForks 4
}

tasks.register('integrationTest', Test) {
  useJUnitPlatform()
  group = "verification"
  testClassesDirs = sourceSets.integrationTest.output.classesDirs
  classpath = sourceSets.integrationTest.runtimeClasspath
}

configurations {
  integrationTestImplementation.extendsFrom(testImplementation)
  integrationTestRuntimeOnly.extendsFrom(testRuntimeOnly)
  integrationTestRuntimeOnly.extendsFrom(runtimeOnly)
}

jacocoTestReport {
  reports {
    xml.required = true
  }
}
